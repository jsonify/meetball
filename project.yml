name: Meetball
options:
  bundleIdPrefix: app.meetball
  xcodeVersion: "16.4"
  deploymentTarget:
    macOS: "15.0"
    # iOS 18: the Join Meeting control and OpenURLIntent (Siri, Action Button).
    iOS: "18.0"
packages:
  SK1Kit:
    url: https://github.com/jsonify/SK1Kit.git
    from: 0.4.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # Builds from Scripts/dist.sh (make run/dist/install) override these with the git commit count, short hash and
    # build time, so Settings › General shows exactly which build is running. Xcode builds keep the defaults.
    CURRENT_PROJECT_VERSION: "1"
    MEETBALL_COMMIT: ""
    MEETBALL_BUILD_DATE: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: TS339TNM5P
targets:
  Meetball:
    type: application
    platform: macOS
    sources: [Meetball]
    dependencies:
      - package: SK1Kit
        product: SK1Tokens
      - package: SK1Kit
        product: SK1UI
    entitlements:
      path: Meetball/Meetball.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Meetball/Info.plist
      properties:
        CFBundleName: Meetball
        CFBundleDisplayName: Meetball
        # actool also adds these from ASSETCATALOG_COMPILER_APPICON_NAME; spelled out so the icon never depends on that merge.
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        MeetballCommit: "$(MEETBALL_COMMIT)"
        MeetballBuildDate: "$(MEETBALL_BUILD_DATE)"
        NSCalendarsFullAccessUsageDescription: Meetball reads your calendars to show upcoming meetings, the menu bar countdown, and Meeting Guardian alerts.
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        GOOGLE_CLIENT_ID: "$(GOOGLE_CLIENT_ID)"
        GOOGLE_CLIENT_SECRET: "$(GOOGLE_CLIENT_SECRET)"
        PRO_PRODUCT_IDS: "$(PRO_PRODUCT_IDS)"
        PRO_UNLOCKED: "$(PRO_UNLOCKED)"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meetball.Meetball
        PRO_UNLOCKED: "YES"
        PRO_PRODUCT_IDS: "app.meetball.pro.monthly,app.meetball.pro.yearly"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MeetballTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Meetball
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEAD_CODE_STRIPPING: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Meetball.app/Contents/MacOS/Meetball"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Meetball for iPhone (personal, not for the App Store): Today / Week / Month, quick add and the Mac app's fun, plus
  # the notifier, which schedules Time Sensitive reminders Siri can announce in CarPlay. It reads Apple Calendar through
  # the same EventKit client, change detector and calendar layout code as the Mac app. See README, "Meetball for iPhone".
  MeetballPhone:
    type: application
    platform: iOS
    sources:
      - MeetballPhone
      # Shared with the Mac app; these files must not use AppKit.
      - Meetball/Calendar/Models.swift
      - Meetball/Calendar/MeetingChanges.swift
      - Meetball/Calendar/AppleCalendarClient.swift
      - Meetball/Calendar/Layout.swift
      - Meetball/Calendar/TimeGridLayout.swift
      - Meetball/Calendar/MiniMonthRibbons.swift
      - Meetball/Calendar/QuickAddParser.swift
      - Meetball/Calendar/MeetingComposer.swift
      - Meetball/Calendar/PreFlight.swift
      - Meetball/Calendar/EchoNotes.swift
      - Meetball/Utilities/AppPreferences.swift
      - Meetball/Utilities/Formatters.swift
      - Meetball/Utilities/MeetingService.swift
      - Meetball/DesignSystem/EventChip.swift
      - Meetball/DesignSystem/Components.swift
      - Meetball/DesignSystem/CountdownLCD.swift
      - Meetball/DesignSystem/HeroUrgency.swift
      - Meetball/MeetingGuardian/Confetti.swift
    dependencies:
      - package: SK1Kit
        product: SK1Tokens
      - package: SK1Kit
        product: SK1UI
      # The widgets and the countdown Live Activity, embedded in the app.
      - target: MeetballWidgets
    entitlements:
      path: MeetballPhone/MeetballPhone.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        # Shared with MeetballWidgets: the app writes the next meetings there for the widgets (WidgetSnapshot).
        com.apple.security.application-groups: [group.app.meetball.MeetballPhone]
    info:
      path: MeetballPhone/Info.plist
      properties:
        CFBundleName: Meetball
        CFBundleDisplayName: Meetball
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCalendarsFullAccessUsageDescription: Meetball shows your calendars, reminds you before meetings, tells you when one moves or is cancelled, and adds the events you type into quick add.
        # Echo: a short voice note after a meeting, transcribed on the iPhone, optionally added to Reminders.
        NSMicrophoneUsageDescription: Echo records a short voice note after a meeting, only while you're recording.
        NSSpeechRecognitionUsageDescription: Echo turns your voice note into text on your iPhone, so it can become a follow-up reminder.
        NSRemindersFullAccessUsageDescription: Echo adds your after-meeting notes to Reminders as follow-ups.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.meetball.MeetballPhone.refresh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        # meetball://join?url=… and meetball://today, from the widgets and the Live Activity (MeetballLink).
        CFBundleURLTypes:
          - CFBundleURLName: app.meetball.MeetballPhone
            CFBundleURLSchemes: [meetball]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meetball.MeetballPhone
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
  # The iPhone app's widgets (next meeting on the Home Screen and Lock Screen) and its countdown Live Activity (Lock
  # Screen, Dynamic Island). It reads meetings the app saves to the shared App Group rather than the calendar itself.
  MeetballWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MeetballWidgets
      # Shared with the app: the App Group snapshot, meetball:// links and the Live Activity's attributes.
      - MeetballPhone/Shared
    dependencies:
      - package: SK1Kit
        product: SK1Tokens
      - package: SK1Kit
        product: SK1UI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: MeetballWidgets/MeetballWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.meetball.MeetballPhone]
    info:
      path: MeetballWidgets/Info.plist
      properties:
        CFBundleName: MeetballWidgets
        CFBundleDisplayName: Meetball
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meetball.MeetballPhone.Widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
  MeetballPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MeetballPhoneTests]
    dependencies:
      - target: MeetballPhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MeetballPhone.app/MeetballPhone"
        BUNDLE_LOADER: "$(TEST_HOST)"
