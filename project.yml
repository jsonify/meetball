name: Meetball
options:
  bundleIdPrefix: app.meetball
  xcodeVersion: "16.4"
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
packages:
  SK1Kit:
    url: https://github.com/jsonify/SK1Kit.git
    from: 0.4.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # Builds from Scripts/dist.sh (make run/dist/install) override these with the git commit count, short hash and
    # build time, so Settings › General shows exactly which build is running. Xcode builds keep the defaults.
    CURRENT_PROJECT_VERSION: "1"
    MEETBALL_COMMIT: ""
    MEETBALL_BUILD_DATE: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: TS339TNM5P
targets:
  Meetball:
    type: application
    platform: macOS
    sources: [Meetball]
    dependencies:
      - package: SK1Kit
        product: SK1Tokens
      - package: SK1Kit
        product: SK1UI
    entitlements:
      path: Meetball/Meetball.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Meetball/Info.plist
      properties:
        CFBundleName: Meetball
        CFBundleDisplayName: Meetball
        # actool also adds these from ASSETCATALOG_COMPILER_APPICON_NAME; spelled out so the icon never depends on that merge.
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        MeetballCommit: "$(MEETBALL_COMMIT)"
        MeetballBuildDate: "$(MEETBALL_BUILD_DATE)"
        NSCalendarsFullAccessUsageDescription: Meetball reads your calendars to show upcoming meetings, the menu bar countdown, and Meeting Guardian alerts.
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        GOOGLE_CLIENT_ID: "$(GOOGLE_CLIENT_ID)"
        GOOGLE_CLIENT_SECRET: "$(GOOGLE_CLIENT_SECRET)"
        PRO_PRODUCT_IDS: "$(PRO_PRODUCT_IDS)"
        PRO_UNLOCKED: "$(PRO_UNLOCKED)"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meetball.Meetball
        PRO_UNLOCKED: "YES"
        PRO_PRODUCT_IDS: "app.meetball.pro.monthly,app.meetball.pro.yearly"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MeetballTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Meetball
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEAD_CODE_STRIPPING: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Meetball.app/Contents/MacOS/Meetball"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Meetball for iPhone: a personal meeting notifier (not for the App Store). It reads Apple Calendar through the same
  # EventKit client and change detector as the Mac app and schedules Time Sensitive reminders, which Siri can announce
  # in CarPlay. See README, "iPhone notifier".
  MeetballPhone:
    type: application
    platform: iOS
    sources:
      - MeetballPhone
      # Shared with the Mac app; these files must not use AppKit.
      - Meetball/Calendar/Models.swift
      - Meetball/Calendar/MeetingChanges.swift
      - Meetball/Calendar/AppleCalendarClient.swift
      - Meetball/Utilities/AppPreferences.swift
    dependencies:
      - package: SK1Kit
        product: SK1Tokens
      - package: SK1Kit
        product: SK1UI
    entitlements:
      path: MeetballPhone/MeetballPhone.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: MeetballPhone/Info.plist
      properties:
        CFBundleName: Meetball
        CFBundleDisplayName: Meetball
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCalendarsFullAccessUsageDescription: Meetball reads your calendars to remind you before meetings and tell you when one moves or is cancelled.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.meetball.MeetballPhone.refresh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meetball.MeetballPhone
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
  MeetballPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MeetballPhoneTests]
    dependencies:
      - target: MeetballPhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MeetballPhone.app/MeetballPhone"
        BUNDLE_LOADER: "$(TEST_HOST)"
