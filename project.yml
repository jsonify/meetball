name: Meetball
options:
  bundleIdPrefix: app.meetball
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Meetball:
    type: application
    platform: macOS
    sources: [Meetball]
    entitlements:
      path: Meetball/Meetball.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Meetball/Info.plist
      properties:
        CFBundleName: Meetball
        CFBundleDisplayName: Meetball
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        GOOGLE_CLIENT_ID: "$(GOOGLE_CLIENT_ID)"
        GOOGLE_CLIENT_SECRET: "$(GOOGLE_CLIENT_SECRET)"
        PRO_PRODUCT_IDS: "$(PRO_PRODUCT_IDS)"
        PRO_UNLOCKED: "$(PRO_UNLOCKED)"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.meetball.Meetball
        PRO_UNLOCKED: "YES"
        PRO_PRODUCT_IDS: "app.meetball.pro.monthly,app.meetball.pro.yearly"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: TS339TNM5P
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MeetballTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Meetball
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: TS339TNM5P
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Meetball.app/Contents/MacOS/Meetball"
        BUNDLE_LOADER: "$(TEST_HOST)"
